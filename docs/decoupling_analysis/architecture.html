<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模块解耦架构提案</title><style>body{margin:0;background:#f2f4f3;color:#203039;font:16px/1.8 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1320px;margin:auto;padding:36px 24px 80px}h1{font-size:32px;line-height:1.4}h2{margin-top:44px;border-top:1px solid #bdcec6;padding-top:24px;color:#177b68}h3{margin-top:28px}p{overflow-wrap:anywhere}a{color:#2e5aa8}table{border-collapse:collapse;min-width:760px;width:100%;font-size:15px}td,th{border:1px solid #bdcec6;padding:12px;text-align:left;vertical-align:top}th{background:#edf5f1}.table-wrap,.diagram-container{overflow-x:auto;margin:24px 0}svg{display:block;min-width:1280px;width:100%;height:auto}pre{background:#edf5f1;padding:20px;overflow:auto;font:14px/1.7 Consolas,monospace}.tag{border-left:4px solid #177b68;padding:12px 20px;background:#edf5f1}nav{display:flex;gap:20px;flex-wrap:wrap}@media(max-width:600px){main{padding:20px 16px}h1{font-size:26px}}@media print{main{max-width:none}svg{min-width:0}table{min-width:0}h2{break-after:avoid}}</style></head><body><main><h1>通用展示与可替换推理后端</h1><p>本图仅表达模块数据流。配置、启动与停止由后台管理进入运行服务，未在总图展开。</p><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="decoupling-title decoupling-desc"><title id="decoupling-title">通用展示与推理模块解耦架构提案</title><desc id="decoupling-desc">采集通过统一帧引用进入可替换推理后端，运行时向执行、预览、归档三个独立消费者分发。通用展示只消费预览服务，历史管理独立。配置控制连接省略。</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52676b"/></marker></defs><rect width="1280" height="720" fill="#f2f4f3"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#203039"><text x="48" y="48" font-size="26" font-weight="600">统一数据契约，分别处理执行、预览与归档</text><text x="48" y="80" font-size="16" fill="#52676b">架构提案 · 不代表已实现；管理配置连接省略，详见报告第 5、7 节</text><g fill="none" stroke="#52676b" stroke-width="2" marker-end="url(#arrow)"><path d="M248 336H300"/><path d="M500 336H552"/><path d="M784 308H796Q804 308 804 300V256Q804 248 812 248H932Q940 248 940 240V216"/><path d="M784 336H824"/><path d="M784 364H796Q804 364 804 372V424Q804 432 812 432H932Q940 432 940 440V456" stroke-dasharray="5 4"/><path d="M1056 336H1100"/><path d="M1056 512H1100" stroke-dasharray="5 4"/></g><g class="node"><rect x="48" y="280" width="200" height="112" rx="8" fill="#ffffff" stroke="#bdcec6"/><text x="64" y="312" font-size="20" font-weight="600">采集模块</text><text x="64" y="342" font-size="15" fill="#52676b">目录 / 模拟器 / SDK</text><text x="64" y="368" font-size="15" fill="#52676b">统一 FrameRef</text></g><g class="node"><rect x="300" y="280" width="200" height="112" rx="8" fill="#ffffff" stroke="#bdcec6"/><text x="316" y="312" font-size="20" font-weight="600">推理适配器</text><text x="316" y="342" font-size="15" fill="#52676b">PyTorch / OV / TRT</text><text x="316" y="368" font-size="15" fill="#52676b">统一 DetectionResult</text></g><g class="node"><rect x="552" y="280" width="232" height="112" rx="8" fill="#edf5f1" stroke="#177b68"/><text x="568" y="312" font-size="20" font-weight="600">运行编排与分发</text><text x="568" y="342" font-size="15" fill="#52676b">结果 + 帧引用</text><text x="568" y="368" font-size="15" fill="#52676b">消费者独立容量与策略</text></g><g class="node"><rect x="824" y="104" width="232" height="112" rx="8" fill="#ffffff" stroke="#bdcec6"/><text x="840" y="136" font-size="20" font-weight="600">执行对接</text><text x="840" y="166" font-size="15" fill="#52676b">标定 / 时限 / 去重</text><text x="840" y="192" font-size="15" fill="#52676b">无需等待 JPEG 或网页</text></g><g class="node"><rect x="824" y="280" width="232" height="112" rx="8" fill="#edf5f1" stroke="#177b68"/><text x="840" y="312" font-size="20" font-weight="600">数据与预览</text><text x="840" y="342" font-size="15" fill="#52676b">压缩 / 同帧配对 / WS</text><text x="840" y="368" font-size="15" fill="#52676b">标准 ViewFrame</text></g><g class="node"><rect x="824" y="456" width="232" height="112" rx="8" fill="#ffffff" stroke="#bdcec6"/><text x="840" y="488" font-size="20" font-weight="600">归档与管理</text><text x="840" y="518" font-size="15" fill="#52676b">结果、图片、历史</text><text x="840" y="544" font-size="15" fill="#52676b">异步状态与失败策略</text></g><g class="node"><rect x="1100" y="280" width="148" height="112" rx="8" fill="#ffffff" stroke="#bdcec6"/><text x="1116" y="312" font-size="20" font-weight="600">通用展示</text><text x="1116" y="342" font-size="15" fill="#52676b">坐标 / 类别</text><text x="1116" y="368" font-size="15" fill="#52676b">角度 / 图像</text></g><g class="node"><rect x="1100" y="456" width="148" height="112" rx="8" fill="#ffffff" stroke="#bdcec6"/><text x="1116" y="488" font-size="20" font-weight="600">后台页面</text><text x="1116" y="518" font-size="15" fill="#52676b">历史查询</text><text x="1116" y="544" font-size="15" fill="#52676b">运行配置</text></g><text x="48" y="610" font-size="16">关键边界：原始帧引用不出现在浏览器协议；推理模块不访问网页和数据库。</text><text x="48" y="640" font-size="16">图中推理适配器为可选后端，不表示同时运行，也不表示三种引擎均已验证。</text><path d="M48 672H92" stroke="#52676b" stroke-width="2"/><text x="104" y="678" font-size="14">实时数据路径</text><path d="M300 672H344" stroke="#52676b" stroke-width="2" stroke-dasharray="5 4"/><text x="356" y="678" font-size="14">归档 / 历史路径</text><text x="624" y="678" font-size="14" fill="#52676b">采集、执行、归档的过载策略须分别确定</text></g></svg></div></main></body></html>
