</style></head><body><main><h1>生产链路架构草案</h1><p>一台 USB3 工业相机，执行支路与预览、留档分别处理。图示展示目标职责，不是已实现能力。</p><div class="diagram-container"><svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc"><title id="arch-title">生产检测、执行、预览与审计分路方案</title><desc id="arch-desc">相机通过有界帧缓冲供给GPU检测，同一结果分别交给执行适配、预览数据模块与异步存储。前端只接收预览，不处于执行路径中。</desc><defs><marker id="accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#177b68"/></marker><marker id="blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#52676b"/></marker></defs><rect width="1280" height="720" fill="#f2f4f3"/><text x="48" y="40" font-size="18" fill="#203039" text-anchor="start">生产目标架构 · 待实现，非当前运行状态</text><path class="connector" d="M 272,124 H 368" fill="none" stroke="#2e5aa8" stroke-width="1.6" marker-end="url(#blue)"/><g class="edge-label"><rect x="293.0" y="89" width="54" height="23" fill="#f2f4f3"/><text x="320" y="104" font-size="12" fill="#52676b" text-anchor="middle">图像帧</text></g><path class="connector" d="M 592,124 H 688" fill="none" stroke="#2e5aa8" stroke-width="1.6" marker-end="url(#blue)"/><g class="edge-label"><rect x="601.0" y="89" width="78" height="23" fill="#f2f4f3"/><text x="640" y="104" font-size="12" fill="#52676b" text-anchor="middle">受控帧缓冲</text></g><path class="connector" d="M 912,124 H 1008" fill="none" stroke="#177b68" stroke-width="1.6" marker-end="url(#accent)"/><g class="edge-label"><rect x="927.0" y="89" width="66" height="23" fill="#f2f4f3"/><text x="960" y="104" font-size="12" fill="#52676b" text-anchor="middle">检测结果</text></g><path class="connector" d="M 1040,168 V 224 Q 1040,232 1032,232 H 200 Q 192,232 192,240 V 376" fill="none" stroke="#177b68" stroke-width="1.6" marker-end="url(#accent)"/><g class="edge-label"><rect x="515.0" y="199" width="90" height="23" fill="#f2f4f3"/><text x="560" y="214" font-size="12" fill="#52676b" text-anchor="middle">执行候选优先</text></g><path class="connector" d="M 1120,168 V 272 Q 1120,280 1112,280 H 648 Q 640,280 640,288 V 376" fill="none" stroke="#2e5aa8" stroke-width="1.6" marker-end="url(#blue)"/><g class="edge-label"><rect x="819.0" y="247" width="90" height="23" fill="#f2f4f3"/><text x="864" y="262" font-size="12" fill="#52676b" text-anchor="middle">帧引用＋结果</text></g><path class="connector" d="M 1200,168 V 320 Q 1200,328 1192,328 H 1088 Q 1080,328 1080,336 V 376" fill="none" stroke="#52676b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#muted)"/><g class="edge-label"><rect x="1087.0" y="295" width="66" height="23" fill="#f2f4f3"/><text x="1120" y="310" font-size="12" fill="#52676b" text-anchor="middle">异步留档</text></g><path class="connector" d="M 640,464 V 552" fill="none" stroke="#2e5aa8" stroke-width="1.6" marker-end="url(#blue)"/><g class="edge-label"><rect x="659.0" y="499" width="102" height="23" fill="#f2f4f3"/><text x="710" y="514" font-size="12" fill="#52676b" text-anchor="middle">压缩图＋元数据</text></g><g class="node"><rect x="48" y="80" width="224" height="88" rx="6" fill="#f2f4f3" stroke="#52676b"/><text x="160.0" y="114" font-size="16" fill="#203039" text-anchor="middle">工业相机 / 模拟器</text><text x="160.0" y="140" font-size="12" fill="#52676b" text-anchor="middle">acA4096-40um / uc</text></g><g class="node"><rect x="368" y="80" width="224" height="88" rx="6" fill="#f2f4f3" stroke="#52676b"/><text x="480.0" y="114" font-size="16" fill="#203039" text-anchor="middle">采集与有界缓冲</text><text x="480.0" y="140" font-size="12" fill="#52676b" text-anchor="middle">pylon / FrameSource</text></g><g class="node"><rect x="688" y="80" width="224" height="88" rx="6" fill="#f2f4f3" stroke="#52676b"/><text x="800.0" y="114" font-size="16" fill="#203039" text-anchor="middle">GPU 预处理与检测</text><text x="800.0" y="140" font-size="12" fill=" 52676b" text-anchor="start">绿色：执行关键路径　蓝色：图像 / 数据交接　虚线：异步存储；框中能力均为方案目标</text></svg></div><footer>2026-10-28 · Factory Demo 生产场景方案草案 · 未改变现有运行程序</footer></main></body></html>
